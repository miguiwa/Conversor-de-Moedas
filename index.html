<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas</title>
    <link rel="stylesheet" href="./style.css">
</head>


<body>
    <img src="./assets/logo.gif" id="logo">

    <main>
        <label>
            Converter <b>de</b>
            <select>
                <option>R$ Real Brasileiro</option>
            </select>


            Converter <b>para</b>
            <select class="moeda-para-converter">
                <option value="dolar">US$ Dólar Americano</option>
                <option value="euro">€ Euro</option>
            </select>

            <b>Valor</b>
            <input placeholder="R$ 10.000" type="number" class="valor">


            <button class="botao">Converter</button>
        </label>



        <section>
            <div>
                <img src="./assets/brasil 2.png">
                <p class="currency-name-to-convert">Real</p>
                <p class="currency-value-to-convert">R$ 10.000,00</p>
            </div>

            <img src="./assets/arrow.png" class="arrow">

            <div>
                <img src="./assets/estados-unidos (1) 1.png" class="bandeira-convertida">
                <p class="currency-name">Dólar Americano</p>
                <p class="currency-value">US$ 2.000,00</p>
            </div>
        </section>
    </main>

<script src="./script.js"></script>
</body>

</html>
